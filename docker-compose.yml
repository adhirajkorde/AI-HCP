version: '3.8'

services:
  # PostgreSQL Database (lightweight for free tier)
  postgres:
    image: postgres:16-alpine
    container_name: ai-hcp-postgres
    environment:
      POSTGRES_DB: ai_hcp
      POSTGRES_USER: ai_hcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_hcp_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_hcp -d ai_hcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - ai-hcp-network

  # Redis for caching (minimal)
  redis:
    image: redis:7-alpine
    container_name: ai-hcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.1'
    networks:
      - ai-hcp-network

  # n8n (optional - for workflow automation) - DISABLED by default for free tier
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-hcp-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-secure_password}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - ai-hcp-network
    profiles:
      - automation

  # Backend API (optimized for free tier)
  backend:
    build:
      context: ./crm_backend
      dockerfile: Dockerfile
    container_name: ai-hcp-backend
    environment:
      - DATABASE_URL=postgresql://ai_hcp:ai_hcp_secure_password@postgres:5432/ai_hcp
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEFAULT_MODEL=gemma2-9b-it
      - ALTERNATIVE_MODEL=llama-3.3-70b-versatile
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/ai-hcp
      - REDIS_URL=redis://redis:6379
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Performance tuning for free tier
      - UVICORN_WORKERS=1
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - ai-hcp-network

  # Frontend (nginx + React) - serves static files
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-hcp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.1'
    networks:
      - ai-hcp-network

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  ai-hcp-network:
    driver: bridge